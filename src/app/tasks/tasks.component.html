@if (isNewTaskAdding) {
<app-new-task [userId]="selectId" (cancel)="onCloseNewTask()" />
}

<section id="tasks">
  <header>
    <h2>{{ selectName }}'s tasks</h2>
    <menu>
      <button (click)="onStartNewTask()">Add Task</button>
    </menu>
  </header>
  <ul>
    @if (filteredTasksById.length > 0) { @for (item of filteredTasksById; track
    item.id) {
    <li>
      <app-task [task]="item"></app-task>
    </li>
    } } @else {
    <div id="no_task">
      <p>No task</p>
    </div>
    }
  </ul>
</section>
