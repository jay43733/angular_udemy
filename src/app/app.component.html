<app-header />
<main>
  <ul id="users">
    @for (item of users; track item.id) {
    <app-user
      [selected]="item.id === selectUser"
      [user]="item"
      (selectUser)="onSelectName($event)"
    ></app-user>
    }
  </ul>
  @if (selectName) {
  <app-tasks
    [selectName]="selectName.name"
    [selectId]="selectName.id"
  ></app-tasks>
  }@else {
  <p>Please select user</p>
  }
</main>
